name: Download Quaternius MegaKit
on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Download with Playwright
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(accept_downloads=True)
              page = context.new_page()
              
              print('正在访问 itch.io...')
              page.goto('https://quaternius.itch.io/downtown-city-megakit', timeout=90000)
              time.sleep(5)
              
              print('寻找主下载按钮...')
              main_btn = page.locator('a.button.download_btn, a:has-text(\"Download\")').first
              main_btn.click()
              time.sleep(5)
              
              print('检查是否有赞助弹窗...')
              no_thanks = page.locator('a:has-text(\"No thanks\"), a:has-text(\"直接下载\"), a:has-text(\"Just take me\")')
              if no_thanks.count() > 0:
                  no_thanks.first.click()
                  time.sleep(5)
              
              print('等待最终下载页面加载...')
              page.wait_for_timeout(8000) 
              
              print('寻找最终的 Download 按钮...')
              # 终极修改：直接找页面上名字叫 Download 的按钮或链接，不管是 a 还是 button
              final_btn = page.locator('a:has-text(\"Download\"), button:has-text(\"Download\"), .download_btn').last
              
              if final_btn.count() == 0:
                  print('❌ 依然找不到按钮，截图记录！')
                  page.screenshot(path='error_screenshot.png')
                  exit(1)
                  
              print('触发下载动作！(最多等3分钟)')
              try:
                  with page.expect_download(timeout=180000) as download_info:
                      final_btn.click()
                  download = download_info.value
                  download.save_as('Downtown_City_MegaKit.zip')
                  print('✅ 文件下载成功！')
              except Exception as e:
                  print(f'❌ 下载失败: {e}')
                  page.screenshot(path='error_screenshot.png')
                  exit(1)
              
              browser.close()
          "

      - name: Upload the model pack
        uses: actions/upload-artifact@v4
        with:
          name: Downtown-City-MegaKit
          path: Downtown_City_MegaKit.zip
          
      - name: Upload error screenshot (如果失败)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error_screenshot.png
