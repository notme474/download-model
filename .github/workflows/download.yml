name: Fetch Quaternius MegaKit URL
on:
  workflow_dispatch:

jobs:
  fetch_url:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Fetch Download URL (Strict Filter)
        run: |
          python -c "
          import time
          from playwright.sync_api import sync_playwright

          captured_urls = []

          def handle_request(request):
              # 🎯 核心修改：只抓 .zip 结尾或者包含 /download/ 的请求，过滤掉图片！
              if request.url.endswith('.zip') or '/download/' in request.url:
                  captured_urls.append(request.url)
                  print(f'🎯 抓取到真实下载地址: {request.url}')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(accept_downloads=True)
              page = context.new_page()
              page.on('request', handle_request)

              print('正在访问 itch.io...')
              page.goto('https://quaternius.itch.io/downtown-city-megakit', timeout=90000)
              time.sleep(5)

              print('寻找主下载按钮...')
              page.locator('a.button.download_btn, a:has-text(\"Download\")').first.click()
              time.sleep(5)

              print('检查并点击 No thanks 弹窗...')
              no_thanks = page.locator('a:has-text(\"No thanks\"), a:has-text(\"直接下载\"), a:has-text(\"Just take me\")')
              if no_thanks.count() > 0:
                  no_thanks.first.click()
                  time.sleep(5)

              print('等待最终下载页面加载...')
              page.wait_for_timeout(5000)

              print('🔥 检查是否出现了备用下载模式弹窗...')
              alt_checkbox = page.locator('input[type=\"checkbox\"]')
              if alt_checkbox.count() > 0 and page.locator('text=\"Enable alternate download mode\"').count() > 0:
                  print('✅ 发现备用下载模式弹窗，正在勾选...')
                  alt_checkbox.check()
                  time.sleep(2)
                  page.locator('text=\"Close\"').click()
                  time.sleep(3)
                  print('✅ 已启用备用模式并关闭弹窗！')
              else:
                  print('没有发现备用模式弹窗，继续尝试...')

              print('再次寻找最终的 Download 按钮并点击...')
              final_btn = page.locator('a:has-text(\"Download\"), button:has-text(\"Download\")').last
              if final_btn.count() > 0:
                  final_btn.click()
              else:
                  print('❌ 找不到最终按钮')

              print('等待网络请求捕获...')
              time.sleep(20)

              if captured_urls:
                  print(f'✅ 成功捕获 {len(captured_urls)} 个下载 URL！')
                  with open('url.txt', 'w') as f:
                      for u in captured_urls:
                          f.write(u + '\n')
              else:
                  print('❌ 未捕获到下载 URL。')
                  page.screenshot(path='error_screenshot.png')

              browser.close()
          "

      - name: Upload URL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: download-url
          path: url.txt

      - name: Upload error screenshot (如果失败)
        if: failure() || hashFiles('url.txt') == ''
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error_screenshot.png
