name: Download Quaternius MegaKit
on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Download with Playwright (Handling Popups)
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(accept_downloads=True)
              page = context.new_page()
              
              print('正在访问 itch.io...')
              page.goto('https://quaternius.itch.io/downtown-city-megakit', timeout=90000)
              time.sleep(5)
              
              # 1. 点击主下载按钮
              print('寻找主下载按钮...')
              main_btn = page.locator('a.button.download_btn, a:has-text(\"Download\")').first
              if main_btn.count() == 0:
                  print('❌ 找不到主下载按钮')
                  exit(1)
              main_btn.click()
              time.sleep(5)
              
              # 2. 处理“No thanks”赞助弹窗
              print('检查是否有赞助弹窗...')
              no_thanks = page.locator('a:has-text(\"No thanks\"), a:has-text(\"直接下载\"), a:has-text(\"Just take me\")')
              if no_thanks.count() > 0:
                  print('✅ 发现弹窗，点击 No thanks...')
                  no_thanks.first.click()
                  time.sleep(5)
              else:
                  print('没有发现弹窗，尝试继续...')
              
              # 3. 寻找最终的真实下载链接并触发
              print('寻找最终文件链接...')
              final_link = page.locator('a[href*=\".zip\"], a[href*=\"/download/\"]').first
              if final_link.count() == 0:
                  print('❌ 找不到最终下载链接')
                  exit(1)
                  
              print('触发下载动作...')
              with page.expect_download(timeout=120000) as download_info:
                  final_link.click()
              
              download = download_info.value
              download.save_as('Downtown_City_MegaKit.zip')
              print('✅ 文件下载成功！')
              browser.close()
          "

      - name: Upload the model pack
        uses: actions/upload-artifact@v4
        with:
          name: Downtown-City-MegaKit
          path: Downtown_City_MegaKit.zip
