name: Download Quaternius MegaKit
on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Download the model pack with browser
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context()
              page = context.new_page()
              
              print('正在访问页面...')
              page.goto('https://quaternius.itch.io/downtown-city-megakit', timeout=60000)
              
              # 等待页面渲染，确保下载按钮已加载
              time.sleep(5) 
              
              print('寻找下载按钮...')
              # 寻找包含 Download 文本的按钮或链接
              download_btn = page.locator('a:has-text(\"Download\"), button:has-text(\"Download\")').first
              
              if download_btn.count() == 0:
                  print('❌ 找不到下载按钮，打印页面内容：')
                  print(page.content()[:500])
                  browser.close()
                  exit(1)
              
              print('找到按钮，准备点击！')
              # 监听下载事件
              with page.expect_download() as download_info:
                  download_btn.click()
              
              download = download_info.value
              download.save_as('Downtown_City_MegaKit.zip')
              print('✅ 下载成功！')
              browser.close()
          "

      - name: Upload the model pack
        uses: actions/upload-artifact@v4
        with:
          name: Downtown-City-MegaKit
          path: Downtown_City_MegaKit.zip
