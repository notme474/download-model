name: Download Quaternius MegaKit (Final)
on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Download with Real Browser Event
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(accept_downloads=True)
              page = context.new_page()

              print('正在访问 itch.io...')
              page.goto('https://quaternius.itch.io/downtown-city-megakit', timeout=90000)
              time.sleep(5)

              print('点击主下载按钮...')
              main_btn = page.locator('a.button.download_btn, a:has-text("Download")').first
              if main_btn.count() == 0:
                  print('❌ 找不到主下载按钮')
                  exit(1)
              main_btn.click()
              time.sleep(5)

              print('点击 No thanks 弹窗...')
              no_thanks = page.locator('a:has-text("No thanks"), a:has-text("直接下载"), a:has-text("Just take me")')
              if no_thanks.count() > 0:
                  no_thanks.first.click()
                  time.sleep(5)

              print('等待最终下载页面加载...')
              page.wait_for_timeout(5000)

              print('检查备用下载模式弹窗...')
              alt_checkbox = page.locator('input[type="checkbox"]')
              if alt_checkbox.count() > 0 and page.locator('text="Enable alternate download mode"').count() > 0:
                  print('✅ 发现备用下载模式，正在勾选...')
                  alt_checkbox.check()
                  time.sleep(2)
                  page.locator('text="Close"').click()
                  time.sleep(3)
                  print('✅ 已启用备用模式并关闭弹窗！')
              else:
                  print('没有发现备用模式弹窗，继续尝试...')

              print('再次点击最终的 Download 按钮，触发真正的浏览器下载事件...')
              final_btn = page.locator('a:has-text("Download"), button:has-text("Download")').last
              if final_btn.count() == 0:
                  print('❌ 找不到最终下载按钮')
                  page.screenshot(path='error_screenshot.png')
                  exit(1)

              try:
                  with page.expect_download(timeout=180000) as download_info:
                      final_btn.click()
                  download = download_info.value
                  download.save_as('Downtown_City_MegaKit.zip')
                  print('✅ 浏览器成功捕获并保存文件！')
              except Exception as e:
                  print(f'❌ 触发下载失败: {e}')
                  page.screenshot(path='error_screenshot.png')
                  exit(1)

              browser.close()
          PY

      - name: Check file size
        run: |
          ls -lh Downtown_City_MegaKit.zip
          if [ $(stat -c%s Downtown_City_MegaKit.zip) -lt 1048576 ]; then
            echo "❌ 文件太小，不是真正的模型包！"
            exit 1
          fi

      - name: Upload model pack
        uses: actions/upload-artifact@v4
        with:
          name: Downtown-City-MegaKit
          path: Downtown_City_MegaKit.zip

      - name: Upload error screenshot (如果失败)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error_screenshot.png
