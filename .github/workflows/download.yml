name: Download Quaternius MegaKit
on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper beautifulsoup4

      - name: Download the model pack
        run: |
          python -c "
          import cloudscraper
          from bs4 import BeautifulSoup
          import sys
          
          url = 'https://quaternius.itch.io/downtown-city-megakit'
          scraper = cloudscraper.create_scraper()
          resp = scraper.get(url)
          soup = BeautifulSoup(resp.text, 'html.parser')
          
          download_link = None
          for a in soup.find_all('a', href=True):
              if '/download/' in a['href']:
                  download_link = a['href']
                  break
          
          if not download_link:
              print('❌ 找不到下载直链，页面内容前500字如下：')
              print(resp.text[:500])
              exit(1)
          
          print(f'✅ 找到下载直链: {download_link}')
          r = scraper.get(download_link, stream=True)
          with open('Downtown_City_MegaKit.zip', 'wb') as f:
              for chunk in r.iter_content(chunk_size=8192):
                  f.write(chunk)
          print('✅ 下载完成！文件大小:', len(r.content))
          "

      - name: Upload the model pack
        uses: actions/upload-artifact@v4
        with:
          name: Downtown-City-MegaKit
          path: Downtown_City_MegaKit.zip
