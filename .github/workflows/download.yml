name: Download Quaternius MegaKit Directly
on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Download with Playwright and upload
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright

          captured_urls = []

          def handle_request(request):
              # 只抓真正的下载链接，过滤图片
              if request.url.endswith('.zip') or '/download/' in request.url:
                  captured_urls.append(request.url)
                  print(f'🎯 抓取到: {request.url}')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(accept_downloads=True)
              page = context.new_page()
              page.on('request', handle_request)

              print('正在访问 itch.io...')
              page.goto('https://quaternius.itch.io/downtown-city-megakit', timeout=90000)
              time.sleep(5)

              print('寻找主下载按钮...')
              page.locator('a.button.download_btn, a:has-text("Download")').first.click()
              time.sleep(5)

              print('点击 No thanks 弹窗...')
              no_thanks = page.locator('a:has-text("No thanks"), a:has-text("直接下载"), a:has-text("Just take me")')
              if no_thanks.count() > 0:
                  no_thanks.first.click()
                  time.sleep(5)

              print('等待最终页面...')
              page.wait_for_timeout(5000)

              print('检查备用下载模式弹窗...')
              alt_checkbox = page.locator('input[type="checkbox"]')
              if alt_checkbox.count() > 0 and page.locator('text="Enable alternate download mode"').count() > 0:
                  print('✅ 勾选备用下载模式...')
                  alt_checkbox.check()
                  time.sleep(2)
                  page.locator('text="Close"').click()
                  time.sleep(3)

              print('再次点击最终 Download 按钮...')
              final_btn = page.locator('a:has-text("Download"), button:has-text("Download")').last
              if final_btn.count() > 0:
                  final_btn.click()
              time.sleep(20)  # 等待网络请求捕获

              if captured_urls:
                  download_url = captured_urls[-1]
                  print(f'开始直接下载: {download_url}')
                  resp = context.request.get(download_url, timeout=180000)
                  if resp.ok:
                      body = resp.body()
                      with open('Downtown_City_MegaKit.zip', 'wb') as f:
                          f.write(body)
                      print(f'✅ 下载成功，大小: {len(body)} 字节')
                  else:
                      print(f'❌ 下载失败，状态码: {resp.status}')
              else:
                  print('❌ 未捕获到下载 URL，截图记录')
                  page.screenshot(path='error_screenshot.png')

              browser.close()
          PY

      - name: Upload model pack
        uses: actions/upload-artifact@v4
        with:
          name: Downtown-City-MegaKit
          path: Downtown_City_MegaKit.zip

      - name: Upload error screenshot (如果失败)
        if: failure() || hashFiles('Downtown_City_MegaKit.zip') == ''
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error_screenshot.png
